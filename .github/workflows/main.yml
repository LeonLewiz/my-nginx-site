name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
         fetch-depth: 0

      - name: Run commands
        run: |
          echo "CI настроен."
          ls -la

      - name: Build an image.
        run: |
          docker build -t my-test-image ./backend

          
      - name: Get version from git
        run: |
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_ENV
          ## Подгрузить версию в environment гитхаба.

      - name: Send to github packages.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # Выводит токен гитхаба через echo и через | передает в след. команду, которая логинит меня в github packages.
          docker tag my-test-image ghcr.io/leonlewiz/my-nginx-site/my-test-image:${VERSION}
          # Метка чтоб пуш нормально работал, ругается что ее нет.
          
          docker push ghcr.io/leonlewiz/my-nginx-site/my-test-image:${VERSION}
          # Пушит образ докера на склад, {{ github.repository }} (подставляет имя) не сработал, в нике есть заглавные буквы из-за этого ошибка.

      - name: Deploy
        run: |
          cd ~/ansible-lab && ansible-playbook -i hosts.ini install_docker.yml
