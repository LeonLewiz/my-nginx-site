version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: my-postgres-db
    restart: always
    environment:
      POSTGRES_USER: leon_user
      POSTGRES_PASSWORD: super_secret_pass
      POSTGRES_DB: site_analytics
    volumes:
      - pgdata:/var/data/db

  backend:
    build: ./backend
    container_name: my-python-backend
    restart: always
    ports:
        - "8081:8000"
    environment:
      DB_HOST: db
      DB_NAME: site_analytics
      DB_USER: leon_user
      DB_PASSWORD: super_secret_pass
    depends_on:
      - db

  web-site:
    build: .
    container_name: my-docker-site
    ports:
      - "9090:80"
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:

